<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corte Poligonal 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800&family=Pacifico&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--navy2:#081b36;--ink:#050f20;--coral:#ff6f59;--yellow:#ffc857;--ocean:#1fa3c4;--jungle:#2f9e6b;--sand:#fff4e0;--mute:#8fa7c4;--line:#1d3d66}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--sand);font:14px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;height:100%}

/* ---------- visor 3D ---------- */
#view{position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#16407c 0%,var(--navy) 48%,var(--ink) 100%)}
#view::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(5,15,32,.75) 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scan{position:absolute;left:0;right:0;height:150px;top:-150px;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(31,163,196,.12),transparent);animation:scan 8s linear infinite}
.c{position:absolute;width:28px;height:28px;z-index:3;pointer-events:none;border:2px solid var(--ocean);filter:drop-shadow(0 0 6px var(--ocean))}
.c.tl{top:8px;left:8px;border-right:0;border-bottom:0}
.c.tr{top:8px;right:8px;border-left:0;border-bottom:0}
.c.bl{bottom:8px;left:8px;border-right:0;border-top:0;border-color:var(--coral);filter:drop-shadow(0 0 6px var(--coral))}
.c.br{bottom:8px;right:8px;border-left:0;border-top:0;border-color:var(--coral);filter:drop-shadow(0 0 6px var(--coral))}
#hint{position:absolute;left:20px;right:20px;top:20px;z-index:3;pointer-events:none;background:rgba(5,15,32,.78);border:1px solid rgba(31,163,196,.4);border-left:4px solid var(--yellow);border-radius:4px;padding:10px 14px;font:13px/1.4 "Space Mono",ui-monospace,monospace;backdrop-filter:blur(8px);box-shadow:0 0 22px rgba(31,163,196,.18)}
#hint::before{content:"▸ ";color:var(--yellow)}
#hint::after{content:"";display:inline-block;width:7px;height:13px;margin-left:6px;vertical-align:-2px;background:var(--yellow);animation:blink 1s steps(1) infinite}
#tel{position:absolute;left:22px;bottom:18px;z-index:3;pointer-events:none;font:12px "Space Mono",ui-monospace,monospace;color:var(--ocean);text-shadow:0 0 8px rgba(31,163,196,.9)}
#fx{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,244,224,.45),transparent 62%)}
#fx::before{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:2px solid var(--yellow);border-radius:50%;opacity:0;box-shadow:0 0 24px var(--yellow)}
#fx.go{animation:flash .7s ease-out}
#fx.go::before{animation:ring .85s ease-out}
#busy{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(5,15,32,.7);font:400 34px "Bebas Neue",Impact,sans-serif;letter-spacing:.12em;color:var(--yellow);text-shadow:0 0 18px var(--yellow)}
#busy::after{content:"";position:absolute;left:0;right:0;height:3px;top:0;background:linear-gradient(90deg,transparent,var(--coral),transparent);box-shadow:0 0 20px var(--coral);animation:laser 1.1s ease-in-out infinite alternate}

/* ---------- panel ---------- */
#panel{width:350px;background:linear-gradient(180deg,rgba(11,37,69,.96),rgba(5,15,32,.98));border-left:1px solid rgba(31,163,196,.45);box-shadow:-18px 0 60px rgba(31,163,196,.10),inset 1px 0 0 rgba(31,163,196,.25);overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column}
h1{font:400 38px/1 "Bebas Neue",Impact,sans-serif;margin:0;letter-spacing:.04em;background:linear-gradient(90deg,var(--sand),var(--ocean),var(--yellow),var(--coral),var(--sand));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite;filter:drop-shadow(0 0 10px rgba(31,163,196,.35))}
.tag{font:400 18px/1.2 Pacifico,cursive;color:var(--coral);text-shadow:0 0 14px rgba(255,111,89,.7)}
section{position:relative;padding:16px 14px 12px;border:1px solid rgba(31,163,196,.22);background:rgba(8,27,54,.55);border-radius:4px}
section::before,section::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
section::before{top:-1px;left:-1px;border-top:2px solid var(--ocean);border-left:2px solid var(--ocean)}
section::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--coral);border-right:2px solid var(--coral)}
h2{font:400 21px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.08em;margin:0 0 12px;padding-bottom:7px;color:var(--ocean);border-bottom:1px dashed rgba(31,163,196,.35);text-shadow:0 0 10px rgba(31,163,196,.5)}
h2::before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;vertical-align:1px;background:var(--yellow);transform:rotate(45deg);box-shadow:0 0 8px var(--yellow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.f label{display:flex;align-items:center;cursor:pointer}

/* botones */
button,label.btn{position:relative;overflow:hidden;background:linear-gradient(180deg,#15386a,#0e2a54);color:var(--sand);border:1px solid rgba(31,163,196,.5);border-radius:6px;padding:10px 14px;font:800 13px Nunito,system-ui,sans-serif;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .1s}
button::after,label.btn::after{content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);transition:left .55s}
button:hover:not(:disabled),label.btn:hover{border-color:var(--ocean);box-shadow:0 0 16px rgba(31,163,196,.5)}
button:hover:not(:disabled)::after,label.btn:hover::after{left:150%}
button:active:not(:disabled){transform:translateY(1px) scale(.98)}
button:disabled{opacity:.35;cursor:not-allowed}
button.go{background:linear-gradient(180deg,#ff8571,var(--coral));border-color:var(--coral);color:var(--ink);font-weight:800}
button.on{background:linear-gradient(180deg,#ffd77f,var(--yellow));border-color:var(--yellow);color:var(--ink);font-weight:800;box-shadow:0 0 18px rgba(255,200,87,.6)}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--yellow);outline-offset:2px}

/* deslizadores */
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:24px;background:transparent;margin:2px 0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ocean),var(--coral));box-shadow:0 0 12px rgba(31,163,196,.6)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ocean),var(--coral));box-shadow:0 0 12px rgba(31,163,196,.6)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:3px;background:var(--yellow);border:2px solid var(--ink);transform:rotate(45deg);box-shadow:0 0 14px var(--yellow)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:3px;background:var(--yellow);border:2px solid var(--ink);transform:rotate(45deg);box-shadow:0 0 14px var(--yellow)}

/* interruptores */
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:40px;height:21px;margin:0 10px 0 0;border-radius:21px;background:#0a2347;border:1px solid var(--line);cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--mute);transition:left .2s,background .2s,box-shadow .2s}
input[type=checkbox]:checked{background:rgba(255,111,89,.22);border-color:var(--coral);box-shadow:0 0 12px rgba(255,111,89,.5)}
input[type=checkbox]:checked::after{left:21px;background:var(--coral);box-shadow:0 0 10px var(--coral)}

input[type=number]{width:80px;background:var(--ink);color:var(--yellow);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:13px "Space Mono",ui-monospace,monospace;transition:border-color .2s,box-shadow .2s}
input[type=number]:focus{border-color:var(--ocean);box-shadow:0 0 12px rgba(31,163,196,.5)}
#depthV{font:13px "Space Mono",ui-monospace,monospace;color:var(--yellow);text-shadow:0 0 8px rgba(255,200,87,.7)}

/* piezas */
#list{display:flex;flex-direction:column;gap:6px}
.pc{display:flex;align-items:center;gap:8px;border:1px solid rgba(31,163,196,.25);border-radius:4px;padding:7px 9px;background:rgba(255,255,255,.02);transition:border-color .2s,background .2s}
.pc:hover{border-color:rgba(31,163,196,.6)}
.pc.sel{border-color:var(--yellow);background:rgba(255,200,87,.08);box-shadow:0 0 14px rgba(255,200,87,.25)}
.pc .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor,0 0 0 2px rgba(255,244,224,.25)}
.pc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:700}
.pc button{padding:3px 8px;border-radius:6px}
#st{font:12px/1.4 "Space Mono",ui-monospace,monospace;color:var(--mute);min-height:2.8em}

@media (prefers-reduced-motion:no-preference){
 section{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
 section:nth-of-type(1){animation-delay:.05s}
 section:nth-of-type(2){animation-delay:.15s}
 section:nth-of-type(3){animation-delay:.25s}
 section:nth-of-type(4){animation-delay:.35s}
 header{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
 button.go:not(:disabled){animation:pulse 1.8s ease-in-out infinite}
 button.on{animation:glow 1.4s ease-in-out infinite}
 .pc.sel .dot{animation:glow 1.6s ease-in-out infinite}
}
@media (prefers-reduced-motion:reduce){
 .scan,#hint::after,h1{animation:none}
 *{transition:none!important}
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:300% 0}}
@keyframes scan{to{transform:translateY(calc(100vh + 300px))}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,111,89,.55),0 0 16px rgba(255,111,89,.4)}50%{box-shadow:0 0 0 9px rgba(255,111,89,0),0 0 28px rgba(255,111,89,.8)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes ring{0%{width:20px;height:20px;margin:-10px;opacity:1}100%{width:1500px;height:1500px;margin:-750px;opacity:0}}
@keyframes laser{from{top:0}to{top:calc(100% - 3px)}}

@media (max-width:760px){
 #app{flex-direction:column}
 #view{flex:1 1 55%}
 #panel{width:100%;flex:1 1 45%;border-left:0;border-top:1px solid rgba(31,163,196,.45);padding:16px 12px}
 h1{font-size:32px}
 #hint{left:14px;right:14px;top:14px;font-size:12px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js",

}}

<body>
<div id="app">
 <div id="view">
  <canvas id="cv"></canvas>
  <div class="scan"></div>
  <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  <div id="tel"></div>
  <div id="fx"></div>
  <div id="hint">Abrí un STL o 3MF para empezar.</div>
  <div id="busy">Cortando…</div>
 </div>
 <aside id="panel">
  <header><h1>Corte Poligonal 3D</h1><span class="tag">by Printaplab3D</span></header>

  <section>
   <h2>Modelo</h2>
   <div class="row">
    <label class="btn">Abrir STL / 3MF<input id="file" type="file" accept=".stl,.3mf" hidden></label>
    <button id="demo">Esfera de prueba</button>
   </div>
  </section>

  <section>
   <h2>Corte</h2>
   <div class="row">
    <button id="draw">Dibujar contorno</button>
    <button id="undoPt" disabled>Quitar punto</button>
   </div>
   <div class="row" style="margin-top:6px">
    <button id="cut" class="go" disabled>Cerrar y cortar</button>
    <button id="cancel" disabled>Cancelar</button>
   </div>
   <div class="f" style="margin-top:10px"><span>Hundir centro (mm)</span><span id="depthV">0</span></div>
   <input id="depth" type="range" min="0" max="50" step="0.5" value="0">
   <div class="f"><label><input id="flat" type="checkbox" checked> Piso plano (corte parejo)</label></div>
  </section>

  <section>
   <h2>Pines de unión</h2>
   <div class="f"><label><input id="pinsOn" type="checkbox" checked> Generar pines y encastres</label></div>
   <div class="f"><span>Cantidad</span><input id="pinN" type="number" min="1" max="6" step="1" value="2"></div>
   <div class="f"><span>Radio (mm)</span><input id="pinR" type="number" min="0.5" step="0.25" value="2"></div>
   <div class="f"><span>Largo (mm)</span><input id="pinL" type="number" min="1" step="0.5" value="6"></div>
   <div class="f"><span>Holgura (mm)</span><input id="pinC" type="number" min="0" step="0.05" value="0.25"></div>
  </section>

  <section>
   <h2>Piezas</h2>
   <div class="f"><span>Separar</span></div>
   <input id="explode" type="range" min="0" max="1" step="0.01" value="0">
   <div id="list" style="margin-top:8px"></div>
   <div class="row" style="margin-top:8px">
    <button id="undoCut" disabled>Deshacer corte</button>
    <button id="expSel" disabled>STL de la pieza</button>
    <button id="expAll" disabled>Todas (ZIP)</button>
   </div>
  </section>

  <div id="st"></div>
 </aside>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {ThreeMFLoader} from 'three/addons/loaders/3MFLoader.js';
import {STLExporter} from 'three/addons/exporters/STLExporter.js';
import {mergeVertices, mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {computeBoundsTree, disposeBoundsTree, acceleratedRaycast} from 'three-mesh-bvh';
import {Brush, Evaluator, SUBTRACTION, INTERSECTION, ADDITION} from 'three-bvh-csg';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const $ = id => document.getElementById(id);
const PAL = ['#ff6f59','#ffc857','#1fa3c4','#2f9e6b','#fff4e0','#e4572e','#7fd1e6','#8fd694'];

// ---------- escena ----------
const view = $('view'), cv = $('cv');
const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
camera.position.set(80, 60, 120);
const controls = new OrbitControls(camera, cv);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
scene.add(sun, sun.target);
const rimA = new THREE.DirectionalLight(0x1fa3c4, 1.1); rimA.position.set(-120, 60, -120);
const rimB = new THREE.DirectionalLight(0xff6f59, .7); rimB.position.set(120, -40, -80);
scene.add(rimA, rimB);
const drawG = new THREE.Group(); scene.add(drawG);
const grid = new THREE.GridHelper(400, 40, 0x1fa3c4, 0x174a73); scene.add(grid);
grid.material.transparent = true; grid.material.opacity = .5;
// plataforma holografica bajo el modelo (solo decoracion, no participa del picking)
const holo = new THREE.Group(); scene.add(holo);
const ringMat = (c, o) => new THREE.MeshBasicMaterial({color: c, transparent: true, opacity: o, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false});
const mkRing = (a, b, arc, c, o) => { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.RingGeometry(a, b, 128, 1, 0, arc), ringMat(c, o)); m.rotation.x = -Math.PI / 2; g.add(m); holo.add(g); return g; };
const ringA = mkRing(.97, 1.0, Math.PI * 1.4, 0x1fa3c4, .85);
const ringB = mkRing(1.08, 1.1, Math.PI * .7, 0xff6f59, .85);
mkRing(.62, .625, Math.PI * 2, 0xffc857, .35);
holo.scale.setScalar(40);
let pm = null;                                             // material de los puntos para el pulso

function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view); resize();
renderer.setAnimationLoop(() => {
  const t = performance.now() / 1000;
  controls.update();
  sun.position.copy(camera.position);
  ringA.rotation.y = t * .5; ringB.rotation.y = -t * .8;
  if (pm) pm.size = 10 + 3 * Math.sin(t * 4);
  renderer.render(scene, camera);
});

// ---------- estado ----------
let pieces = [], selected = null, drawMode = false;
let pts = [], dir = null;
let history = [], nPiece = 0, colorIdx = 0, diag = 100;
const ev = new Evaluator(); ev.attributes = ['position', 'normal']; ev.useGroups = false;

const say = (t, hint) => { $('st').textContent = t || ''; if (hint !== undefined) $('hint').textContent = hint; };

// ---------- geometría ----------
function posOnly(g){
  g = g.index ? g.toNonIndexed() : g.clone();
  for (const k of Object.keys(g.attributes)) if (k !== 'position') g.deleteAttribute(k);
  return g;
}
function prep(g){
  g = posOnly(g);
  g = mergeVertices(g, 1e-4);
  g.computeVertexNormals();
  g.computeBoundsTree();
  return g;
}
function addPiece(geo, name){
  geo.computeBoundingBox();
  const mat = new THREE.MeshStandardMaterial({color: PAL[colorIdx++ % PAL.length], roughness: .55, metalness: .05});
  const m = new THREE.Mesh(geo, mat);
  m.userData.name = name || ('Pieza ' + (++nPiece));
  m.userData.c = geo.boundingBox.getCenter(new THREE.Vector3());
  scene.add(m); pieces.push(m);
  return m;
}
function clearAll(){
  pieces.forEach(p => scene.remove(p));
  pieces = []; history = []; selected = null; nPiece = 0; colorIdx = 0;
  cancelDraw();
}
function loadGeometry(raw, label){
  clearAll();
  let g = raw.clone();
  g.computeBoundingBox();
  const c = g.boundingBox.getCenter(new THREE.Vector3());
  g.translate(-c.x, -c.y, -c.z);
  g = prep(g);
  g.computeBoundingBox();
  diag = g.boundingBox.getSize(new THREE.Vector3()).length();
  const sz = g.boundingBox.getSize(new THREE.Vector3());
  $('depth').max = Math.ceil(diag / 2); $('depth').value = 0;
  $('depthV').textContent = $('depth').value;
  const p = addPiece(g, label || 'Modelo');
  select(p);
  grid.position.y = -sz.y / 2;
  holo.position.y = -sz.y / 2 + 0.05; holo.scale.setScalar(Math.max(sz.x, sz.z) * .75);
  camera.position.set(diag * .8, diag * .6, diag * 1.2);
  controls.target.set(0, 0, 0); controls.update();
  $('explode').value = 0;
  renderList();
  say(Math.round(sz.x) + ' × ' + Math.round(sz.y) + ' × ' + Math.round(sz.z) + ' mm',
      'Tocá “Dibujar contorno” y marcá puntos. Podés girar entre punto y punto.');
}

async function loadFile(f){
  try{
    const buf = await f.arrayBuffer();
    let geo;
    if (/\.stl$/i.test(f.name)){
      geo = new STLLoader().parse(buf);
      geo.rotateX(-Math.PI / 2);                      // Z arriba → Y arriba
    } else {
      const grp = new ThreeMFLoader().parse(buf);
      grp.updateMatrixWorld(true);
      const list = [];
      grp.traverse(o => { if (o.isMesh){ const g = posOnly(o.geometry); g.applyMatrix4(o.matrixWorld); list.push(g); } });
      if (!list.length) throw new Error('El 3MF no tiene mallas.');
      geo = mergeGeometries(list);
    }
    loadGeometry(geo, f.name.replace(/\.[^.]+$/, ''));
  }catch(e){ say('No se pudo abrir el archivo: ' + e.message); }
}
$('file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
$('demo').onclick = () => loadGeometry(new THREE.SphereGeometry(25, 64, 48), 'Esfera');

// ---------- selección / lista ----------
function select(p){
  selected = p;
  pieces.forEach(m => m.material.emissive.setHex(m === p ? 0x1b3558 : 0x000000));
  renderList();
}
function renderList(){
  const L = $('list'); L.innerHTML = '';
  pieces.forEach(p => {
    const r = document.createElement('div');
    r.className = 'pc' + (p === selected ? ' sel' : '');
    r.innerHTML = '<span class="dot"></span><span class="nm"></span><button title="Mostrar u ocultar">👁</button><button title="Eliminar">🗑</button>';
    r.children[0].style.background = '#' + p.material.color.getHexString();
    r.children[1].textContent = p.userData.name;
    r.children[1].onclick = () => select(p);
    r.children[2].onclick = () => { p.visible = !p.visible; r.style.opacity = p.visible ? 1 : .45; };
    r.children[3].onclick = () => { scene.remove(p); pieces = pieces.filter(x => x !== p); if (selected === p) selected = null; history = []; renderList(); upd(); };
    if (!p.visible) r.style.opacity = .45;
    L.appendChild(r);
  });
  upd();
}
function upd(){
  $('tel').textContent = (drawMode ? 'MODO DIBUJO' : 'MODO SELECCION') + '  ·  PIEZAS ' + pieces.length + '  ·  PUNTOS ' + pts.length + '  ·  Ø ' + Math.round(diag) + ' mm';
  $('cut').disabled = !(drawMode && pts.length >= 3);
  $('undoPt').disabled = !pts.length;
  $('cancel').disabled = !drawMode;
  $('undoCut').disabled = !history.length;
  $('expSel').disabled = !selected;
  $('expAll').disabled = !pieces.length;
  $('draw').classList.toggle('on', drawMode);
}
$('explode').oninput = () => {
  const k = +$('explode').value * 1.2;
  pieces.forEach(p => p.position.copy(p.userData.c).multiplyScalar(k));
};

// ---------- dibujo del contorno ----------
const ray = new THREE.Raycaster(); ray.firstHitOnly = true;
const ndc = new THREE.Vector2();
let vis = [];
function pick(e){
  const r = cv.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(pieces.filter(p => p.visible), false)[0] || null;
}
let down = null;
cv.addEventListener('pointerdown', e => { if (e.isPrimary) down = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (!down || !e.isPrimary) return;
  const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]); down = null;
  if (moved > 6) return;                                 // arrastre = girar la vista
  const h = pick(e);
  if (!drawMode){ if (h) select(h.object); return; }
  if (!h) return;
  if (pts.length === 0) select(h.object);
  else if (h.object !== selected){ say('Todos los puntos tienen que estar sobre la misma pieza.'); return; }
  pts.push(h.point.clone());
  vis.push(h.point.clone().addScaledVector(h.face.normal, diag * 0.004));
  refreshDraw();
});

// mover puntos ya puestos: arrastrar el marcador
let dragI = -1;
function nearMarker(e){
  const r = cv.getBoundingClientRect(), R = e.pointerType === 'touch' ? 26 : 14;
  let best = -1, bd = R;
  vis.forEach((p, i) => {
    const q = p.clone().project(camera);
    if (q.z > 1) return;
    const d = Math.hypot(r.left + (q.x * .5 + .5) * r.width - e.clientX, r.top + (-q.y * .5 + .5) * r.height - e.clientY);
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}
view.addEventListener('pointerdown', e => {
  if (!drawMode || !e.isPrimary || e.target !== cv) return;
  const i = nearMarker(e);
  if (i < 0) return;
  dragI = i; down = null;
  cv.setPointerCapture(e.pointerId);
  e.stopPropagation();                                   // evita que OrbitControls gire la vista
}, true);
cv.addEventListener('pointermove', e => {
  if (dragI < 0){ cv.style.cursor = drawMode && nearMarker(e) >= 0 ? 'grab' : ''; return; }
  const h = pick(e);
  if (!h || h.object !== selected) return;
  pts[dragI] = h.point.clone();
  vis[dragI] = h.point.clone().addScaledVector(h.face.normal, diag * 0.004);
  refreshDraw();
});
const endDrag = () => { dragI = -1; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// Entre punto y punto la recta pasa por dentro del modelo y deja "montañitas" en el borde del corte.
// Se agregan puntos intermedios y se pegan a la superficie, así el contorno la sigue.
function densify(P, piece){
  const ctr = piece.localToWorld(piece.userData.c.clone());
  const step = diag / 70, out = [], rc = new THREE.Raycaster(); rc.firstHitOnly = true;
  for (let i = 0; i < P.length; i++){
    const a = P[i], b = P[(i + 1) % P.length];
    const k = Math.min(40, Math.max(1, Math.ceil(a.distanceTo(b) / step)));
    for (let j = 0; j < k; j++){
      const q = a.clone().lerp(b, j / k);
      if (j > 0){
        const o = q.clone().sub(ctr).normalize();
        rc.set(q.clone().addScaledVector(o, diag * 2), o.clone().negate());
        const h = rc.intersectObject(piece, false)[0];
        if (h) q.copy(h.point);
      }
      out.push(q);
    }
  }
  return out;
}
const sinkVal = () => +$('depth').value;

function refreshDraw(){
  drawG.clear(); pm = null;
  if (pts.length){
    const P = new THREE.Points(new THREE.BufferGeometry().setFromPoints(vis),
      new THREE.PointsMaterial({color: 0xffc857, size: 10, sizeAttenuation: false}));
    P.renderOrder = 11; drawG.add(P); pm = P.material;
    const Ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(vis.length > 2 ? [...vis, vis[0]] : vis),
      new THREE.LineBasicMaterial({color: 0xffc857}));
    Ln.renderOrder = 10; drawG.add(Ln);
  }
  if (pts.length >= 3 && selected){
    const S = loopSolid(densify(pts, selected), sinkVal(), diag * .5, selected.localToWorld(selected.userData.c.clone()));
    if (S.error) say(S.error);
    else {
      const m = new THREE.Mesh(S.geo, new THREE.MeshBasicMaterial({color: 0x1fa3c4, transparent: true, opacity: .22, depthWrite: false}));
      m.renderOrder = 5; drawG.add(m);
      say('', pts.length + ' puntos. Arrastrá un punto para moverlo, seguí marcando o tocá “Cerrar y cortar”.');
    }
  } else if (pts.length){
    say('', 'Seguí marcando. Podés girar el modelo y arrastrar un punto para moverlo.');
  }
  upd();
}
$('flat').onchange = () => { if (pts.length >= 3) refreshDraw(); };
$('depth').oninput = () => { $('depthV').textContent = $('depth').value; if (pts.length >= 3) refreshDraw(); };

$('draw').onclick = () => {
  if (!selected){ say('Elegí una pieza primero.'); return; }
  drawMode = true; pts = []; vis = []; drawG.clear();
  say('', 'Tocá sobre el modelo para marcar puntos. Arrastrá para girar y seguir por atrás.'); upd();
};
$('undoPt').onclick = () => { pts.pop(); vis.pop(); refreshDraw(); };
function cancelDraw(){
  drawMode = false; pts = []; vis = []; dir = null; drawG.clear(); pm = null;
  upd();
}
$('cancel').onclick = () => { cancelDraw(); say('', 'Corte cancelado.'); };
addEventListener('keydown', e => {
  if (e.key === 'Enter' && !$('cut').disabled) $('cut').click();
  if (e.key === 'Escape' && drawMode) $('cancel').click();
  if (e.key === 'Backspace' && pts.length && e.target.tagName !== 'INPUT') $('undoPt').click();
});

// ---------- sólido de corte ----------
// Piso = abanico desde el centro del contorno hasta cada punto (sigue el contorno 3D).
// Paredes = suben en la dirección normal del contorno. El sólido encierra "la parte de arriba".
function basisFor(d){
  const up = Math.abs(d.y) > 0.95 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  const u = new THREE.Vector3().crossVectors(d, up).normalize();
  const v = new THREE.Vector3().crossVectors(d, u);
  return {u, v};
}
function loopSolid(P0, sink, H, ctr){
  const P = P0.slice(), m = P.length;
  const n = new THREE.Vector3();
  for (let i = 0; i < m; i++){
    const a = P[i], b = P[(i + 1) % m];
    n.x += (a.y - b.y) * (a.z + b.z); n.y += (a.z - b.z) * (a.x + b.x); n.z += (a.x - b.x) * (a.y + b.y);
  }
  if (n.length() < 1e-9) return {error: 'Los puntos están en línea. Marcá un contorno cerrado.'};
  n.normalize();
  const C = new THREE.Vector3(); P.forEach(p => C.add(p)); C.divideScalar(m);
  const s = n.dot(C.clone().sub(ctr));
  const flip = Math.abs(s) < diag * 0.05 ? n.y < 0 : s < 0;   // contorno alrededor: "arriba"; parche: hacia afuera
  if (flip){ n.negate(); P.reverse(); }
  const {u, v} = basisFor(n);
  const pts2 = P.map(p => { const r = p.clone().sub(C); return new THREE.Vector2(r.dot(u), r.dot(v)); });
  const hs = P.map(p => p.clone().sub(C).dot(n));
  const flat = $('flat').checked;                      // piso plano: ignora las alturas de cada punto
  if (flat) hs.fill(0);
  for (let i = 0; i < m; i++){
    const a = pts2[i], b = pts2[(i + 1) % m];
    if (a.x * b.y - a.y * b.x <= 1e-9) return {error: 'El contorno se cruza o es muy cóncavo. Probá con puntos más ordenados.'};
  }
  const Cs = C.clone().addScaledVector(n, -sink), Tc = C.clone().addScaledVector(n, H);
  // Las paredes se corren un 1% hacia afuera: si quedan tangentes a la superficie (corte alrededor del modelo)
  // dejan dientes en el borde. Así el borde lo define solo el piso.
  const dl = diag * 0.01;
  const Q = P.map((p, i) => { const d2 = pts2[i].clone().normalize(); const b = flat ? C.clone().addScaledVector(u, pts2[i].x).addScaledVector(v, pts2[i].y) : p; return b.clone().addScaledVector(u, d2.x * dl).addScaledVector(v, d2.y * dl); });
  const T = Q.map(p => p.clone().addScaledVector(n, H));
  const a = [];
  const tri = (p, q, r) => a.push(p.x, p.y, p.z, q.x, q.y, q.z, r.x, r.y, r.z);
  for (let i = 0; i < m; i++){
    const j = (i + 1) % m;
    tri(Cs, Q[j], Q[i]);
    tri(Tc, T[i], T[j]);
    tri(Q[i], Q[j], T[j]);
    tri(Q[i], T[j], T[i]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(a, 3));
  geo.computeVertexNormals();
  return {geo, n, u, v, C, pts2, hs};
}
function centroid2(P){
  let a = 0, x = 0, y = 0;
  for (let i = 0; i < P.length; i++){
    const p = P[i], q = P[(i + 1) % P.length], c = p.x * q.y - q.x * p.y;
    a += c; x += (p.x + q.x) * c; y += (p.y + q.y) * c;
  }
  a /= 2;
  return Math.abs(a) < 1e-9 ? P[0].clone() : new THREE.Vector2(x / (6 * a), y / (6 * a));
}
function inside(p, P){
  let r = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++){
    if ((P[i].y > p.y) !== (P[j].y > p.y) && p.x < (P[j].x - P[i].x) * (p.y - P[i].y) / (P[j].y - P[i].y) + P[i].x) r = !r;
  }
  return r;
}
function floorH(q, pts2, hs, sink){
  const m = pts2.length;
  for (let i = 0; i < m; i++){
    const a = pts2[i], b = pts2[(i + 1) % m], det = a.x * b.y - a.y * b.x;
    const s = (q.x * b.y - q.y * b.x) / det, t = (a.x * q.y - a.y * q.x) / det;
    if (s >= -1e-6 && t >= -1e-6 && s + t <= 1 + 1e-6) return -sink * (1 - s - t) + s * hs[i] + t * hs[(i + 1) % m];
  }
  return null;
}
const empty = b => !b.geometry.attributes.position || b.geometry.attributes.position.count === 0;

// efecto de onda al terminar un corte
function fx(){ const e = $('fx'); e.classList.remove('go'); void e.offsetWidth; e.classList.add('go'); }

// ---------- cortar ----------
$('cut').onclick = () => {
  $('busy').style.display = 'flex';
  setTimeout(() => { try{ doCut(); } catch(e){ console.error(e); say('Falló el corte: ' + e.message); } $('busy').style.display = 'none'; }, 30);
};
function doCut(){
  const piece = selected, sink = sinkVal();
  const S = loopSolid(densify(pts, piece).map(p => piece.worldToLocal(p.clone())), sink, diag * 2, piece.userData.c);
  if (S.error){ say(S.error); return; }
  const {geo, n, u, v, C, pts2, hs} = S;
  const bm = new Brush(piece.geometry); bm.updateMatrixWorld();
  const bp = new Brush(geo); bp.updateMatrixWorld();
  let A = ev.evaluate(bm, bp, INTERSECTION);
  let B = ev.evaluate(bm, bp, SUBTRACTION);
  if (empty(A) || empty(B)){ say('El contorno no divide el modelo. Probá hundiendo el centro o cambiando los puntos.'); return; }

  let msg = 'Sin pines.';
  if ($('pinsOn').checked){
    const k = Math.max(1, Math.min(6, +$('pinN').value | 0)), r = +$('pinR').value, len = +$('pinL').value, clr = +$('pinC').value;
    const c2 = centroid2(pts2);
    let pos = [];
    if (k === 1) pos.push(c2);
    else for (let i = 0; i < k; i++) pos.push(c2.clone().lerp(pts2[Math.floor(i * pts2.length / k)], .55));
    pos = pos.filter(p => inside(p, pts2));
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
    const cyl = (rad, h, c) => {
      const g = new THREE.CylinderGeometry(rad, rad, h, 32); g.deleteAttribute('uv');
      const b = new Brush(g); b.quaternion.copy(q); b.position.copy(c); b.updateMatrixWorld(); return b;
    };
    const rc = new THREE.Raycaster(); rc.firstHitOnly = true;
    let placed = 0;
    pos.forEach(p => {
      const h = floorH(p, pts2, hs, sink);
      if (h === null) return;
      const base = C.clone().addScaledVector(u, p.x).addScaledVector(v, p.y).addScaledVector(n, h);
      piece.material.side = THREE.DoubleSide;                    // espesor disponible sobre el piso
      rc.set(piece.localToWorld(base.clone().addScaledVector(n, 0.02)), n);
      const hit = rc.intersectObject(piece, false)[0];
      piece.material.side = THREE.FrontSide;
      const embed = hit ? Math.min(len, hit.distance * 0.6) : len * 0.5;
      A = ev.evaluate(A, cyl(r, len + embed, base.clone().addScaledVector(n, (embed - len) / 2)), ADDITION);
      B = ev.evaluate(B, cyl(r + clr, len + clr + .5, base.clone().addScaledVector(n, -(len + clr - .5) / 2)), SUBTRACTION);
      placed++;
    });
    msg = placed ? placed + ' pin(es) generados.' : 'No entró ningún pin dentro del contorno.';
  }

  const gA = A.geometry, gB = B.geometry;
  gA.computeBoundsTree(); gB.computeBoundsTree();
  scene.remove(piece); pieces = pieces.filter(x => x !== piece);
  const base = piece.userData.name;
  const pa = addPiece(gA, base + ' · arriba'), pb = addPiece(gB, base + ' · resto');
  history.push({old: piece, nu: [pa, pb]});
  cancelDraw(); select(pa);
  $('explode').oninput();
  fx();
  say(msg, 'Listo. Podés seguir cortando cualquier pieza.');
}
$('undoCut').onclick = () => {
  const h = history.pop(); if (!h) return;
  h.nu.forEach(p => { scene.remove(p); pieces = pieces.filter(x => x !== p); });
  scene.add(h.old); pieces.push(h.old);
  select(h.old); $('explode').oninput();
};

// ---------- exportar ----------
function stlBlob(mesh){
  const g = mesh.geometry.clone(); g.rotateX(Math.PI / 2);   // Y arriba → Z arriba
  const data = new STLExporter().parse(new THREE.Mesh(g), {binary: true});
  return new Blob([data], {type: 'model/stl'});
}
const safe = s => s.replace(/[^\w\-]+/g, '_');
function save(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$('expSel').onclick = () => selected && save(stlBlob(selected), safe(selected.userData.name) + '.stl');
$('expAll').onclick = async () => {
  if (typeof JSZip === 'undefined'){ say('No cargó JSZip. Revisá la conexión.'); return; }
  const z = new JSZip();
  for (const [i, p] of pieces.entries()) z.file((i + 1) + '_' + safe(p.userData.name) + '.stl', await stlBlob(p).arrayBuffer());
  save(await z.generateAsync({type: 'blob'}), 'piezas.zip');
};
</script>
</body>
